<svg width="1400" height="520" viewBox="0 0 1400 520" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif">
  <rect x="0" y="0" width="1400" height="520" fill="#F2F2F2"/>
  <text x="700" y="56" font-size="30" font-weight="800" fill="#1e1e1e" text-anchor="middle">2026년 하반기 AI 수학 타임라인</text>
  <text x="700" y="88" font-size="18" fill="#555" text-anchor="middle">8부에서 다루는 사례를 발표일 순서로 늘어놓았다</text>

  <line x1="100" y1="260" x2="1300" y2="260" stroke="#1e1e1e" stroke-width="3"/>

  <!-- 8.7 8월 1일 OpenAI -->
  <g>
    <line x1="160" y1="260" x2="160" y2="190" stroke="#1e1e1e" stroke-width="2"/>
    <circle cx="160" cy="260" r="14" fill="#DCEAFB" stroke="#1e1e1e" stroke-width="2.5"/>
    <rect x="60" y="120" width="200" height="66" rx="14" fill="#DCEAFB" stroke="#1e1e1e" stroke-width="2"/>
    <text x="160" y="144" font-size="15" fill="#1e1e1e" text-anchor="middle" font-weight="700">8월 1일, OpenAI</text>
    <text x="160" y="166" font-size="13" fill="#333" text-anchor="middle">수학과 이론전산학 10건</text>
    <text x="160" y="182" font-size="12" fill="#666" text-anchor="middle">8.7, 🟡</text>
  </g>

  <!-- 8.10 8월 10일 Anthropic Riemann -->
  <g>
    <line x1="340" y1="260" x2="340" y2="330" stroke="#1e1e1e" stroke-width="2"/>
    <circle cx="340" cy="260" r="14" fill="#FBF1D6" stroke="#1e1e1e" stroke-width="2.5"/>
    <rect x="240" y="334" width="200" height="66" rx="14" fill="#FBF1D6" stroke="#1e1e1e" stroke-width="2"/>
    <text x="340" y="358" font-size="15" fill="#1e1e1e" text-anchor="middle" font-weight="700">8월 10일, 앤트로픽</text>
    <text x="340" y="380" font-size="13" fill="#333" text-anchor="middle">리만 가설 하한 개선</text>
    <text x="340" y="396" font-size="12" fill="#666" text-anchor="middle">8.10, 🟡</text>
  </g>

  <!-- 8.11 8월 12일 Anthropic Hadamard -->
  <g>
    <line x1="520" y1="260" x2="520" y2="190" stroke="#1e1e1e" stroke-width="2"/>
    <circle cx="520" cy="260" r="14" fill="#FBF1D6" stroke="#1e1e1e" stroke-width="2.5"/>
    <rect x="420" y="120" width="200" height="66" rx="14" fill="#FBF1D6" stroke="#1e1e1e" stroke-width="2"/>
    <text x="520" y="144" font-size="15" fill="#1e1e1e" text-anchor="middle" font-weight="700">8월 12일, 앤트로픽</text>
    <text x="520" y="166" font-size="13" fill="#333" text-anchor="middle">아다마르 행렬 668차</text>
    <text x="520" y="182" font-size="12" fill="#666" text-anchor="middle">8.11, 🟡</text>
  </g>

  <!-- 8.8 9월 8일 OpenAI Navier-Stokes -->
  <g>
    <line x1="760" y1="260" x2="760" y2="330" stroke="#1e1e1e" stroke-width="2"/>
    <circle cx="760" cy="260" r="14" fill="#FBE6E2" stroke="#1e1e1e" stroke-width="2.5"/>
    <rect x="660" y="334" width="210" height="66" rx="14" fill="#FBE6E2" stroke="#1e1e1e" stroke-width="2"/>
    <text x="765" y="358" font-size="15" fill="#1e1e1e" text-anchor="middle" font-weight="700">9월 8일, OpenAI</text>
    <text x="765" y="380" font-size="13" fill="#333" text-anchor="middle">나비어-스토크스, 유출 논란</text>
    <text x="765" y="396" font-size="12" fill="#666" text-anchor="middle">8.8, ⚠️</text>
  </g>

  <!-- 9월 11일 필즈상 28인 성명 (주석, 번호 없음) -->
  <g>
    <line x1="940" y1="260" x2="940" y2="190" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="5 4"/>
    <circle cx="940" cy="260" r="12" fill="#F2F2F2" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="3 3"/>
    <rect x="840" y="120" width="210" height="66" rx="14" fill="#F2F2F2" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="945" y="144" font-size="15" fill="#1e1e1e" text-anchor="middle" font-weight="700">9월 11일</text>
    <text x="945" y="166" font-size="13" fill="#333" text-anchor="middle">필즈상 28인 공동 성명</text>
    <text x="945" y="182" font-size="12" fill="#666" text-anchor="middle">8.8 참고</text>
  </g>

  <!-- 8.9 10월 6일 OpenAI 대량 공개 -->
  <g>
    <line x1="1200" y1="260" x2="1200" y2="330" stroke="#1e1e1e" stroke-width="2"/>
    <circle cx="1200" cy="260" r="16" fill="#FBE6E2" stroke="#1e1e1e" stroke-width="3"/>
    <rect x="1080" y="334" width="240" height="72" rx="14" fill="#FBE6E2" stroke="#1e1e1e" stroke-width="2.5"/>
    <text x="1200" y="360" font-size="15" fill="#1e1e1e" text-anchor="middle" font-weight="700">10월 6일, OpenAI</text>
    <text x="1200" y="382" font-size="13" fill="#333" text-anchor="middle">원고 약 722건 대량 공개</text>
    <text x="1200" y="400" font-size="12" fill="#666" text-anchor="middle">8.9, ⚠️ 가장 큰 논쟁</text>
  </g>

  <text x="700" y="460" font-size="14" fill="#777" text-anchor="middle">실선 테두리는 8부 본문의 항목 번호가 있는 사례, 점선은 본문에서 참고로만 다루는 사건이다</text>
  <text x="700" y="486" font-size="14" fill="#777" text-anchor="middle">색은 검증 상태를 나타낸다. 노랑/파랑 = 부분진행(🟡), 분홍 = 논쟁(⚠️)</text>
</svg>
